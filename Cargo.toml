[package]
name = "solver-gpu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Navigator",
  "Gpu",
  "GpuAdapter",
  "GpuDevice",
  "GpuQueue",
  "GpuBuffer",
  "GpuBufferDescriptor",
  "GpuComputePipeline",
  "GpuShaderModuleDescriptor",
  "GpuBindGroup",
  "GpuBindGroupDescriptor",
  "GpuBindGroupLayout",
  "GpuBindGroupEntry"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
