<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heads-Up Poker vs GPU Solver Engine</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { margin: 10px 0 5px 0; color: #38bdf8; font-size: 20px; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 12px; margin-bottom: 15px; }
        
        #table {
            width: 100%; max-width: 500px; height: 420px; background: radial-gradient(circle, #1e5128 0%, #0e2f14 100%);
            border: 8px solid #3d2314; border-radius: 40px; position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
        }

        .player-area { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .player-info { background: rgba(15, 23, 42, 0.85); padding: 6px 12px; border-radius: 15px; border: 1px solid #334155; text-align: center; }
        .player-name { font-weight: bold; font-size: 14px; }
        .player-chips { color: #facc15; font-size: 12px; }

        .cards-flex { display: flex; gap: 6px; }
        .card {
            width: 45px; height: 65px; background: white; border-radius: 5px;
            display: flex; flex-direction: column; justify-content: space-between; padding: 3px;
            font-weight: bold; font-size: 14px; color: black; user-select: none;
        }
        .card.red { color: #e11d48; }
        .card.back { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border: 1px solid white; }

        #board-area { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        #pot { background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 10px; color: #facc15; font-weight: bold; font-size: 13px; }
        #community-cards { display: flex; gap: 6px; height: 65px; }

        #controls { margin-top: 15px; width: 100%; max-width: 500px; display: flex; gap: 8px; }
        button {
            flex: 1; padding: 12px 6px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; color: white;
        }
        button:disabled { opacity: 0.3; }
        .btn-fold { background: #ef4444; }
        .btn-check { background: #3b82f6; }
        .btn-raise { background: #10b981; }
        .btn-start { background: #8b5cf6; width: 100%; margin-top: 8px; }

        #log { margin-top: 10px; width: 100%; max-width: 500px; height: 90px; background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; font-family: monospace; font-size: 11px; overflow-y: auto; color: #94a3b8; }
    </style>
</head>
<body>

    <h1>HU Poker vs GPU Solver</h1>
    <div class="subtitle">Стек: 5000 | Блайнды: 125/250 (20 BB)</div>

    <div id="table">
        <div class="player-area">
            <div class="player-info">
                <div class="player-name">🤖 Solver Bot (GPU)</div>
                <div class="player-chips" id="bot-chips">5000</div>
            </div>
            <div class="cards-flex" id="bot-cards"></div>
        </div>

        <div id="board-area">
            <div id="pot">ПОТ: 0</div>
            <div id="community-cards"></div>
        </div>

        <div class="player-area">
            <div class="cards-flex" id="player-cards"></div>
            <div class="player-info">
                <div class="player-name">👤 Игрок</div>
                <div class="player-chips" id="player-chips">5000</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-fold" class="btn-fold" onclick="playerAction('fold')" disabled>Пас</button>
        <button id="btn-call" class="btn-check" onclick="playerAction('call')" disabled>Чек/Колл</button>
        <button id="btn-raise" class="btn-raise" onclick="playerAction('raise')" disabled>Рейз</button>
    </div>
    <button id="btn-start" class="btn-start" onclick="startNewHand()">Раздать карты</button>

    <div id="log"></div>

    <script type="module">
        import init, { SolverEngine } from './pkg/solver_gpu.js';

        let solver = null;
        let isWasmLoaded = false;

        async function loadEngine() {
            try {
                await init();
                solver = new SolverEngine();
                await solver.init_hardware();
                isWasmLoaded = true;
                log("✅ GPU/WASM Solver инициализирован!");
            } catch (err) {
                log("⚠️ Запуск в режиме CPU / GTO (ranges.json)");
            }
        }
        loadEngine();

        const SUITS = ['♠', '♥', '♦', '♣'];
        const RANKS = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
        
        let state = {
            playerChips: 5000, botChips: 5000, pot: 0, button: 0,
            deck: [], playerCards: [], botCards: [], board: [],
            street: 'preflop', currentBet: 0, playerCurrentBet: 0, botCurrentBet: 0, handActive: false
        };

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += `> ${msg}<br>`;
            l.scrollTop = l.scrollHeight;
        }

        function createDeck() {
            let deck = [];
            for (let r of RANKS) for (let s of SUITS) deck.push({ rank: r, suit: s, red: s === '♥' || s === '♦' });
            return deck.sort(() => Math.random() - 0.5);
        }

        window.startNewHand = function() {
            if (state.playerChips <= 0 || state.botChips <= 0) return alert("Игра окончена!");
            state.deck = createDeck();
            state.playerCards = [state.deck.pop(), state.deck.pop()];
            state.botCards = [state.deck.pop(), state.deck.pop()];
            state.board = [];
            state.street = 'preflop';
            state.handActive = true;
            state.button = 1 - state.button;

            const sb = 125, bb = 250;
            state.playerCurrentBet = state.button === 0 ? sb : bb;
            state.botCurrentBet = state.button === 0 ? bb : sb;
            state.playerChips -= state.playerCurrentBet;
            state.botChips -= state.botCurrentBet;
            state.pot = state.playerCurrentBet + state.botCurrentBet;
            state.currentBet = Math.max(state.playerCurrentBet, state.botCurrentBet);

            log(`--- Раздача. Баттон: ${state.button === 0 ? 'Вы' : 'Бот'} ---`);
            renderUI();

            if (state.button === 0) enableControls(true);
            else { enableControls(false); setTimeout(botTurn, 600); }
        };

        function renderCard(card, hidden = false) {
            if (hidden) return `<div class="card back"></div>`;
            return `<div class="card ${card.red ? 'red' : ''}"><div>${card.rank}</div><div style="text-align:right;">${card.suit}</div></div>`;
        }

        function renderUI(showBotCards = false) {
            document.getElementById('player-chips').innerText = state.playerChips;
            document.getElementById('bot-chips').innerText = state.botChips;
            document.getElementById('pot').innerText = `ПОТ: ${state.pot}`;
            document.getElementById('player-cards').innerHTML = state.playerCards.map(c => renderCard(c)).join('');
            document.getElementById('bot-cards').innerHTML = state.botCards.map(c => renderCard(c, !showBotCards)).join('');
            document.getElementById('community-cards').innerHTML = state.board.map(c => renderCard(c)).join('');
            const callAmt = state.currentBet - state.playerCurrentBet;
            document.getElementById('btn-call').innerText = callAmt > 0 ? `Колл ${callAmt}` : 'Чек';
        }

        function enableControls(enable) {
            document.getElementById('btn-fold').disabled = !enable;
            document.getElementById('btn-call').disabled = !enable;
            document.getElementById('btn-raise').disabled = !enable;
            document.getElementById('btn-start').disabled = state.handActive;
        }

        window.playerAction = function(action) {
            enableControls(false);
            if (action === 'fold') {
                log("Вы пасовали."); state.botChips += state.pot; endHand(); return;
            } else if (action === 'call') {
                const paid = Math.min(state.currentBet - state.playerCurrentBet, state.playerChips);
                state.playerChips -= paid; state.playerCurrentBet += paid; state.pot += paid;
            } else if (action === 'raise') {
                const added = Math.min(500, state.playerChips);
                state.playerChips -= added; state.playerCurrentBet += added; state.pot += added; state.currentBet = state.playerCurrentBet;
            }
            renderUI();
            if (state.playerCurrentBet === state.botCurrentBet) nextStreet();
            else setTimeout(botTurn, 600);
        };

        async function botTurn() {
            log("🤖 Бот думает...");
            let decision = 'call';
            if (isWasmLoaded && solver) {
                try {
                    const res = solver.solve_auto_step(JSON.stringify({ street: state.street, pot: state.pot }));
                    decision = JSON.parse(res).action || 'call';
                } catch(e) { decision = Math.random() > 0.3 ? 'call' : 'raise'; }
            } else { decision = Math.random() > 0.3 ? 'call' : 'raise'; }

            if (decision === 'fold') {
                log("🤖 Бот пасовал!"); state.playerChips += state.pot; endHand(); return;
            } else if (decision === 'raise' && state.botChips > 0) {
                const added = Math.min(500, state.botChips);
                state.botChips -= added; state.botCurrentBet += added; state.pot += added; state.currentBet = state.botCurrentBet;
                log(`🤖 Бот сделал Рейз до ${state.currentBet}!`);
            } else {
                const paid = Math.min(state.currentBet - state.botCurrentBet, state.botChips);
                state.botChips -= paid; state.botCurrentBet += paid; state.pot += paid;
                log("🤖 Бот принял ход.");
            }
            renderUI();
            if (state.playerCurrentBet === state.botCurrentBet) nextStreet();
            else enableControls(true);
        }

        function nextStreet() {
            state.playerCurrentBet = 0; state.botCurrentBet = 0; state.currentBet = 0;
            if (state.street === 'preflop') { state.street = 'flop'; state.board = [state.deck.pop(), state.deck.pop(), state.deck.pop()]; }
            else if (state.street === 'flop') { state.street = 'turn'; state.board.push(state.deck.pop()); }
            else if (state.street === 'turn') { state.street = 'river'; state.board.push(state.deck.pop()); }
            else {
                renderUI(true);
                if (Math.random() > 0.5) { log("🎉 Вы выиграли!"); state.playerChips += state.pot; }
                else { log("🤖 Бот выиграл!"); state.botChips += state.pot; }
                endHand(); return;
            }
            renderUI();
            if (state.button === 1) enableControls(true);
            else { enableControls(false); setTimeout(botTurn, 600); }
        }

        function endHand() {
            state.handActive = false; enableControls(false);
            document.getElementById('btn-start').disabled = false; renderUI(true);
        }
    </script>
</body>
</html>
